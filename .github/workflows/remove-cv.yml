name: Remove CV button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-cv-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove CV link and this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = '                <a href="cv.pdf" class="social-link"><i class="fas fa-file-alt"></i></a>\n'
          if old not in s:
              raise SystemExit("CV link not found")
          p.write_text(s.replace(old, "", 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-cv.yml
          git commit -m "Remove CV button"
          git push
